name: Build and Release APK
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > ${{ github.workspace }}/scannerkey.jks
          fi

      - name: Create keystore.properties
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -n "$STORE_PASSWORD" ]; then
            echo "storePassword=${{ secrets.STORE_PASSWORD }}" > keystore.properties
            echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> keystore.properties
            echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> keystore.properties
            echo "storeFile=scannerkey.jks" >> keystore.properties
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Read version info from build.gradle.kts
        id: version_info
        run: |
          V_CODE=$(grep 'versionCode =' app/build.gradle.kts | grep -o '[0-9]\+' || grep 'versionCode' app/build.gradle.kts | grep -o '[0-9]\+')
          V_NAME=$(grep 'versionName =' app/build.gradle.kts | cut -d '"' -f 2 || grep 'versionName' app/build.gradle.kts | cut -d '"' -f 2)
          echo "Trovato Version Code: $V_CODE"
          echo "Trovato Version Name: $V_NAME"
          echo "VERSION_CODE=$V_CODE" >> $GITHUB_OUTPUT
          echo "VERSION_NAME=$V_NAME" >> $GITHUB_OUTPUT

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Rename APK
        run: |
          if [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
            mv app/build/outputs/apk/release/app-release.apk \
               app/build/outputs/apk/release/QuickScan-v${{ steps.version_info.outputs.VERSION_NAME }}.apk
          elif [ -f "app/build/outputs/apk/release/app-release-unsigned.apk" ]; then
            mv app/build/outputs/apk/release/app-release-unsigned.apk \
               app/build/outputs/apk/release/QuickScan-v${{ steps.version_info.outputs.VERSION_NAME }}.apk
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "QuickScan v${{ steps.version_info.outputs.VERSION_NAME }}"
          body: |
            versionCode: ${{ steps.version_info.outputs.VERSION_CODE }}
            versionName: ${{ steps.version_info.outputs.VERSION_NAME }}

            🚀 **Build automatica QuickScan**
            Questa versione è pronta per l'installazione su Android.
          files: |
            app/build/outputs/apk/release/QuickScan-v${{ steps.version_info.outputs.VERSION_NAME }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
